<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>SeñasMex IA</title>
  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Custom Google font-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="/css/styles_alfabeto.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container_navbar">
            <div class="nav_logo">
                <a class="brand" href="/inicio.html">
                    <span class="logo">SeñasMex IA</span>
                </a>
            </div>
            <div class="nav-items">
                <a href="/inicio.html" class="nav-link">Inicio</a>
                <a href="alfabetoma.html" class="nav-link active">Alfabeto</a>
                <a href="deletreo.html" class="nav-link">Deletreo</a>
                <a href="proyecto.html" class="nav-link">Proyecto</a>
                <a href="contacto.html" class="nav-link">Equipo</a>
                <a href="./index.html" class="nav-link logout">Salir</a>
            </div>
        </div>
    </nav>
    <div class="hero">

    

    <div class="main-container">
        <div class="text-content">
            <h1>APRENDE EL ALFABETO</h1>
            
            <p class="description">
                Mejora la interacción entre las personas sordas o con problemas de audición, recuerda el abecedario
            </p>
            
            <div class="lsm-tag">Lenguaje de Señas Mexicano</div>
        </div>
        
        <div class="card-content">
            <div class="interactive-card">
                <h2 class="card-title">Busca una letra</h2>
                
                <div class="input-group">
                    <input type="text" id="letraInput" placeholder="Ingresa una letra del abecedario"
                        class="form-control">
                </div>
                
                <div class="sign-image-container">
                    <div id="imagenContenedor" class="sign-image-wrapper"></div>
                    <a class="btn btn-primary" href="./alfabeto.html"></a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mapeo de letras a sus archivos (ajusta las rutas según tu estructura)
        const recursosPorLetra = {
            'a': { imagen: '/static/sign_images/alphabet/a.jpeg'},
            'b': { imagen: '/static/sign_images/alphabet/b.jpeg'},
            'c': { imagen: '/static/sign_images/alphabet/c.jpeg'},
            'd': { imagen: '/static/sign_images/alphabet/d.jpeg'},
            'e': { imagen: '/static/sign_images/alphabet/e.jpeg'},
            'f': { imagen: '/static/sign_images/alphabet/f.jpeg'},
            'g': { imagen: '/static/sign_images/alphabet/g.jpeg'},
            'h': { imagen: '/static/sign_images/alphabet/h.jpeg'},
            'i': { imagen: '/static/sign_images/alphabet/i.jpeg'},
            'j': { imagen: '/static/sign_images/alphabet/j.jpeg'},
            'k': { imagen: '/static/sign_images/alphabet/k.jpeg'},
            'l': { imagen: '/static/sign_images/alphabet/l.jpeg'},
            'm': { imagen: '/static/sign_images/alphabet/m.jpeg'},
            'n': { imagen: '/static/sign_images/alphabet/n.jpeg'},
            'ñ': { imagen: '/static/sign_images/alphabet/ñ.jpeg'},
            'o': { imagen: '/static/sign_images/alphabet/o.jpeg'},
            'p': { imagen: '/static/sign_images/alphabet/p.jpeg'},
            'q': { imagen: '/static/sign_images/alphabet/q.jpeg'},
            'r': { imagen: '/static/sign_images/alphabet/r.jpeg'},
            's': { imagen: '/static/sign_images/alphabet/s.jpeg'},
            't': { imagen: '/static/sign_images/alphabet/t.jpeg'},
            'u': { imagen: '/static/sign_images/alphabet/u.jpeg'},
            'v': { imagen: '/static/sign_images/alphabet/v.jpeg'},
            'w': { imagen: '/static/sign_images/alphabet/w.jpeg'},
            'x': { imagen: '/static/sign_images/alphabet/x.jpeg'},
            'y': { imagen: '/static/sign_images/alphabet/y.jpeg'},
            'z': { imagen: '/static/sign_images/alphabet/z.jpeg'},
        };

        document.getElementById('letraInput').addEventListener('input', (e) => {
            const letra = e.target.value.toLowerCase();
            
            // Validar que sea una letra permitida
            if (letra.length === 1 && letra.match(/[a-zñ]/i)) {
                const recursos = recursosPorLetra[letra];
                
                // Mostrar imagen
                if (recursos && recursos.imagen) {
                    document.getElementById('imagenContenedor').innerHTML = `
                        <img src="${recursos.imagen}" alt="Seña para ${letra.toUpperCase()}">
                    `;
                } else {
                    console.error(`No hay imagen para la letra ${letra}`);
                }

                // Reproducir audio (opcional)
                if (recursos && recursos.audio) {
                    new Audio(recursos.audio).play().catch(e => console.log("Error con audio:", e));
                }
            } else if (letra.length > 0) {
                e.target.value = ''; // Limpiar si no es válido
                alert("Ingresa solo una letra (A-Z o Ñ)");
            }
        });

        // Enfocar el input al cargar la página
        window.onload = () => document.getElementById('letraInput').focus();
    </script>


    <script>
        // Menú hamburguesa modificado
        const hamburger = document.createElement('div');
        hamburger.className = 'hamburger';
        hamburger.innerHTML = `
            <span></span>
            <span></span>
            <span></span>
        `;
            
        const navbar = document.querySelector('.container_navbar');
        const navItems = document.querySelector('.nav-items');
        const body = document.body;
            
        // Insertar hamburguesa antes de los nav-items
        navbar.insertBefore(hamburger, navItems);
            
        // Toggle del menú
        hamburger.addEventListener('click', function() {
            this.classList.toggle('active');
            navItems.classList.toggle('active');
            body.classList.toggle('menu-open');
        });
        
        // Cerrar menú al hacer clic en un enlace
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                navItems.classList.remove('active');
                body.classList.remove('menu-open');
            });
        });
    </script>
    
</body>
</html>
